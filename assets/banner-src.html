<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  * { margin: 0; box-sizing: border-box; }
  body {
    width: 1600px;
    height: 520px;
    overflow: hidden;
    position: relative;
    background: radial-gradient(120% 180% at 28% 40%, #1e1b4b 0%, #111424 45%, #080911 80%, #05060a 100%);
    font-family: "Plus Jakarta Sans", sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  svg.mesh {
    position: absolute;
    inset: 0;
    opacity: 0.6;
    pointer-events: none;
  }

  .motes span {
    position: absolute;
    border-radius: 50%;
    filter: blur(0.4px);
  }

  .lockup {
    position: absolute;
    left: 100px;
    top: 50%;
    transform: translateY(-50%);
    display: flex;
    align-items: center;
    gap: 68px;
  }

  .icon-box {
    width: 296px;
    height: 296px;
    flex: none;
    filter: drop-shadow(0 22px 50px rgba(0, 0, 0, 0.8)) drop-shadow(0 0 28px rgba(168, 85, 247, 0.35));
  }

  .icon-box svg {
    width: 296px;
    height: 296px;
    display: block;
  }

  .words {
    padding-bottom: 8px;
    overflow: visible;
  }

  .wordmark {
    font-size: 110px;
    font-weight: 800;
    letter-spacing: -0.04em;
    line-height: 1.1;
    color: #f8fafc;
    display: flex;
    align-items: baseline;
    overflow: visible;
  }

  .wordmark .dot {
    width: 22px;
    height: 22px;
    border-radius: 50%;
    margin-left: 16px;
    background: radial-gradient(circle at 38% 32%, #ffd98f 0%, #ffa732 45%, #ee7027 100%);
    box-shadow: 0 0 26px 6px rgba(255, 167, 50, 0.55);
    flex-shrink: 0;
  }

  .tagline {
    margin-top: 20px;
    font-size: 28px;
    font-weight: 400;
    letter-spacing: -0.01em;
    color: #94a3b8;
    line-height: 1.4;
    white-space: nowrap;
  }

  .tagline b {
    color: #f1f5f9;
    font-weight: 600;
  }
</style>
</head>
<body>
  <!-- Ambient geometry: orbital rays converging toward the master crystal -->
  <svg class="mesh" width="1600" height="520" viewBox="0 0 1600 520" fill="none" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="fade" x1="1600" y1="0" x2="240" y2="0" gradientUnits="userSpaceOnUse">
        <stop offset="0%" stop-color="#818cf8" stop-opacity="0.3"/>
        <stop offset="55%" stop-color="#c084fc" stop-opacity="0.12"/>
        <stop offset="100%" stop-color="#a855f7" stop-opacity="0"/>
      </linearGradient>
    </defs>
    <g stroke="url(#fade)" stroke-width="1.6">
      <path d="M1600 40 C 1150 70, 760 150, 470 258"/>
      <path d="M1600 130 C 1180 145, 800 195, 470 262"/>
      <path d="M1600 225 C 1200 228, 820 240, 470 266"/>
      <path d="M1600 320 C 1200 305, 820 285, 470 270"/>
      <path d="M1600 415 C 1180 385, 800 330, 470 274"/>
      <path d="M1600 495 C 1150 450, 760 375, 470 278"/>
    </g>
    <g stroke="#c084fc" stroke-opacity="0.08" stroke-width="1.2">
      <path d="M1180 60 C 1160 190, 1160 330, 1180 462"/>
      <path d="M960 92 C 940 210, 940 315, 960 432"/>
      <path d="M760 138 C 745 225, 745 300, 760 388"/>
      <path d="M600 185 C 590 240, 590 285, 600 340"/>
    </g>
  </svg>

  <div class="motes" id="motes"></div>

  <div class="lockup">
    <!-- Canonical Tahoe Gel-Glass Master Icon -->
    <div class="icon-box">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="296" height="296" preserveAspectRatio="xMidYMid meet">
        <defs>
          <clipPath id="macSuperellipseBanner">
            <path d="M 512 0 C 138 0 0 138 0 512 C 0 886 138 1024 512 1024 C 886 1024 1024 886 1024 512 C 1024 138 886 0 512 0 Z" />
          </clipPath>
          <linearGradient id="bgGradBanner" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#181b2a"/>
            <stop offset="45%" stop-color="#0e101a"/>
            <stop offset="100%" stop-color="#07080d"/>
          </linearGradient>
          <radialGradient id="ambientGlowBanner" cx="50%" cy="28%" r="75%">
            <stop offset="0%" stop-color="#6366f1" stop-opacity="0.45"/>
            <stop offset="50%" stop-color="#a855f7" stop-opacity="0.18"/>
            <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
          </radialGradient>
          <linearGradient id="prismEdgeBanner" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#38bdf8"/>
            <stop offset="30%" stop-color="#818cf8"/>
            <stop offset="70%" stop-color="#c084fc"/>
            <stop offset="100%" stop-color="#f43f5e"/>
          </linearGradient>
          <linearGradient id="crystalTopBanner" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#ffffff" stop-opacity="0.75"/>
            <stop offset="50%" stop-color="#818cf8" stop-opacity="0.55"/>
            <stop offset="100%" stop-color="#312e81" stop-opacity="0.95"/>
          </linearGradient>
          <linearGradient id="crystalRightBanner" x1="100%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.85"/>
            <stop offset="50%" stop-color="#6366f1" stop-opacity="0.65"/>
            <stop offset="100%" stop-color="#1e1b4b" stop-opacity="0.95"/>
          </linearGradient>
          <linearGradient id="crystalBottomBanner" x1="0%" y1="100%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#ec4899" stop-opacity="0.9"/>
            <stop offset="50%" stop-color="#a855f7" stop-opacity="0.7"/>
            <stop offset="100%" stop-color="#4f46e5" stop-opacity="0.5"/>
          </linearGradient>
          <linearGradient id="emberPipBanner" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#f59e0b"/>
            <stop offset="100%" stop-color="#ea580c"/>
          </linearGradient>
        </defs>
        <g clip-path="url(#macSuperellipseBanner)">
          <rect width="1024" height="1024" fill="url(#bgGradBanner)"/>
          <rect width="1024" height="1024" fill="url(#ambientGlowBanner)"/>
          <g stroke="rgba(255, 255, 255, 0.05)" stroke-width="2" fill="none">
            <circle cx="512" cy="512" r="400" stroke-dasharray="8, 12"/>
            <circle cx="512" cy="512" r="275" stroke-dasharray="6, 8"/>
          </g>
          <ellipse cx="512" cy="770" rx="290" ry="72" fill="#000000" opacity="0.75"/>
          <g>
            <polygon points="512,186 800,354 800,670 512,838 224,670 224,354" fill="none" stroke="url(#prismEdgeBanner)" stroke-width="6" opacity="0.75"/>
            <polygon points="512,206 512,512 244,370" fill="url(#crystalTopBanner)"/>
            <polygon points="512,206 780,370 512,512" fill="url(#crystalRightBanner)"/>
            <polygon points="244,370 512,512 512,818 244,654" fill="url(#crystalBottomBanner)"/>
            <polygon points="512,512 780,370 780,654 512,818" fill="url(#crystalTopBanner)" opacity="0.9"/>
            <path d="M 512 342 Q 512 512 346 512 Q 512 512 512 682 Q 512 512 678 512 Q 512 512 512 342 Z" fill="#ffffff" opacity="0.95"/>
            <circle cx="512" cy="512" r="32" fill="url(#emberPipBanner)" stroke="#ffffff" stroke-width="4.5"/>
            <line x1="512" y1="206" x2="512" y2="512" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" opacity="0.9"/>
            <line x1="512" y1="512" x2="244" y2="370" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" opacity="0.8"/>
            <line x1="512" y1="512" x2="780" y2="370" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" opacity="0.8"/>
            <line x1="512" y1="512" x2="512" y2="818" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" opacity="0.7"/>
          </g>
          <path d="M 512 0 C 138 0 0 138 0 512 C 0 886 138 1024 512 1024 C 886 1024 1024 886 1024 512 C 1024 138 886 0 512 0 Z" fill="none" stroke="rgba(255, 255, 255, 0.22)" stroke-width="3.5"/>
        </g>
      </svg>
    </div>
    
    <div class="words">
      <div class="wordmark">agy-plugins<span class="dot"></span></div>
      <div class="tagline">Native plugin &amp; marketplace manager. <b>Built for Antigravity.</b></div>
    </div>
  </div>

  <script>
    const m = document.getElementById('motes');
    let seed = 42;
    const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
    for (let i = 0; i < 40; i++) {
      const x = 360 + rnd() * 1200, y = 40 + rnd() * 440, s = 2 + rnd() * 3.5;
      const warm = 1 - (x - 360) / 1200;
      const el = document.createElement('span');
      el.style.cssText = `left:${x}px;top:${y}px;width:${s}px;height:${s}px;opacity:${0.25 + rnd() * 0.5};` +
        (warm > 0.65 ? `background:#ffc46e;box-shadow:0 0 ${s*2.5}px rgba(255,167,50,.5);` : `background:#a855f7;box-shadow:0 0 ${s*2}px rgba(168,85,247,.4);`);
      m.appendChild(el);
    }
  </script>
</body>
</html>
