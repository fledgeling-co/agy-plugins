<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <clipPath id="macSuperellipseC">
      <path d="M 512 0 C 138 0 0 138 0 512 C 0 886 138 1024 512 1024 C 886 1024 1024 886 1024 512 C 1024 138 886 0 512 0 Z" />
    </clipPath>

    <!-- Deep Space Indigo Palette -->
    <linearGradient id="bgGradC" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <radialGradient id="nebulaGlowC" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#38bdf8" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="ringGradC" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>

    <filter id="glowC" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <g clip-path="url(#macSuperellipseC)">
    <rect width="1024" height="1024" fill="url(#bgGradC)"/>
    <rect width="1024" height="1024" fill="url(#nebulaGlowC)"/>

    <!-- Orbital Constellation Rings -->
    <g stroke="rgba(255, 255, 255, 0.1)" stroke-width="2" fill="none">
      <ellipse cx="512" cy="512" rx="380" ry="160" transform="rotate(-30 512 512)"/>
      <ellipse cx="512" cy="512" rx="380" ry="160" transform="rotate(30 512 512)"/>
      <ellipse cx="512" cy="512" rx="380" ry="160" transform="rotate(90 512 512)"/>
    </g>

    <!-- Interconnected Marketplaces Mesh Bridge -->
    <g stroke="url(#ringGradC)" stroke-width="4" fill="none" opacity="0.85">
      <polygon points="512,240 760,380 680,690 344,690 264,380"/>
      <line x1="512" y1="240" x2="512" y2="512"/>
      <line x1="760" y1="380" x2="512" y2="512"/>
      <line x1="680" y1="690" x2="512" y2="512"/>
      <line x1="344" y1="690" x2="512" y2="512"/>
      <line x1="264" y1="380" x2="512" y2="512"/>
    </g>

    <!-- Constellation Node Pearls -->
    <g filter="url(#glowC)">
      <!-- Vertex 1 (Diolog Plugins) -->
      <circle cx="512" cy="240" r="28" fill="#38bdf8" stroke="#ffffff" stroke-width="4"/>
      <!-- Vertex 2 (Fledgeling Plugins) -->
      <circle cx="760" cy="380" r="28" fill="#818cf8" stroke="#ffffff" stroke-width="4"/>
      <!-- Vertex 3 (Atlas Plugins) -->
      <circle cx="680" cy="690" r="28" fill="#ec4899" stroke="#ffffff" stroke-width="4"/>
      <!-- Vertex 4 (Local Repos) -->
      <circle cx="344" cy="690" r="28" fill="#a855f7" stroke="#ffffff" stroke-width="4"/>
      <!-- Vertex 5 (Ecosystem) -->
      <circle cx="264" cy="380" r="28" fill="#06b6d4" stroke="#ffffff" stroke-width="4"/>

      <!-- Central Antigravity Hub & Warm Ember Core -->
      <circle cx="512" cy="512" r="54" fill="#ffffff" stroke="#818cf8" stroke-width="6"/>
      <circle cx="512" cy="512" r="32" fill="#ea580c"/>
      <circle cx="504" cy="504" r="8" fill="#ffffff" opacity="0.8"/>
    </g>

    <!-- Superellipse Bevel Light -->
    <path d="M 512 0 C 138 0 0 138 0 512 C 0 886 138 1024 512 1024 C 886 1024 1024 886 1024 512 C 1024 138 886 0 512 0 Z" fill="none" stroke="rgba(255, 255, 255, 0.2)" stroke-width="3"/>
  </g>
</svg>
